<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>顔なき夜</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#030406;overflow:hidden}iframe{display:block;border:0;width:100%;height:100%;background:#030406}
</style>
</head>
<body>
<iframe id="game" src="game.html?v=4" allow="autoplay"></iframe>
<script>
const SOURCES=[
 'https://raw.githubusercontent.com/Hanson-Sun/http-server/main/test_resources/sounds/Female_Scream_Horror-NeoPhyTe-138499973.mp3',
 'https://ggzlaatzichhoren.wordpress.com/wp-content/uploads/2015/03/female_scream_horror-neophyte-138499973.mp3',
 'https://soundbible.com/mp3/Female_Scream_Horror-NeoPhyTe-138499973.mp3'
];
let sourceIndex=0;
const femaleScream=new Audio(SOURCES[0]);
femaleScream.preload='auto';
femaleScream.volume=1;
femaleScream.playbackRate=1;
femaleScream.preservesPitch=true;
femaleScream.onerror=()=>{
  sourceIndex++;
  if(sourceIndex<SOURCES.length){
    femaleScream.src=SOURCES[sourceIndex];
    try{femaleScream.load();}catch(e){}
  }
};
let unlocked=false;
function unlockScream(){
  if(unlocked)return;
  try{
    femaleScream.volume=.001;
    femaleScream.currentTime=0;
    const p=femaleScream.play();
    if(p&&p.then)p.then(()=>setTimeout(()=>{
      femaleScream.pause();
      femaleScream.currentTime=0;
      femaleScream.volume=1;
      unlocked=true;
    },35)).catch(()=>{});
  }catch(e){}
}
function screamNow(){
  try{
    femaleScream.pause();
    femaleScream.currentTime=0;
    femaleScream.volume=1;
    femaleScream.playbackRate=1;
    femaleScream.play().catch(()=>{});
  }catch(e){}
}
const game=document.getElementById('game');
game.addEventListener('load',()=>{
  const w=game.contentWindow;
  const d=game.contentDocument;
  ['pointerdown','touchstart','click'].forEach(t=>d.addEventListener(t,unlockScream,{passive:true}));

  // Suppress the game's old vocal clips. The parent page owns the only female scream.
  ['screamAudio','shortScreamAudio','longScreamAudio'].forEach(id=>{
    const a=d.getElementById(id);
    if(!a)return;
    try{a.pause();a.volume=0;a.play=()=>Promise.resolve();}catch(e){}
  });
  try{w.playVocal=function(){};}catch(e){}

  let lastFinal=0;
  function checkFinal(el){
    if(!(el instanceof w.Element))return;
    if(!el.classList.contains('jump-scare'))return;
    if(!el.classList.contains('final-closeup'))return;
    if(!el.classList.contains('on'))return;
    const now=Date.now();
    if(now-lastFinal<1500)return;
    lastFinal=now;

    // Duck BGM so the real female voice stays clearly audible.
    const bgm=d.getElementById('bgmAudio');
    const oldVol=bgm?bgm.volume:null;
    if(bgm)bgm.volume=Math.min(.12,bgm.volume);
    screamNow();
    setTimeout(()=>{ if(bgm&&oldVol!==null)bgm.volume=oldVol; },1400);
  }

  const observer=new MutationObserver(mutations=>{
    for(const m of mutations){
      if(m.type==='attributes') checkFinal(m.target);
      if(m.type==='childList'){
        m.addedNodes.forEach(n=>{
          if(n.nodeType===1){
            checkFinal(n);
            n.querySelectorAll?.('.jump-scare.final-closeup.on').forEach(checkFinal);
          }
        });
      }
    }
  });
  observer.observe(d.documentElement,{subtree:true,attributes:true,attributeFilter:['class'],childList:true});
  d.querySelectorAll('.jump-scare.final-closeup.on').forEach(checkFinal);
});
</script>
</body>
</html>
